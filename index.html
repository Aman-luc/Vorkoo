<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vorkoo — Every piece of work. One clear place.</title>
  <meta name="description" content="A simple, focused work management system designed to bring clarity, control, and organization to your work, deadlines, and payments.">
  <meta name="theme-color" content="#0B0F19">
  
  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Immediate meta refresh fallback for GitHub Pages -->
  <meta http-equiv="refresh" content="0; url=Landing-page/landing.html">
  <link rel="canonical" href="Landing-page/landing.html">

  <script>
    // Immediate script redirect preserving query parameters and hash fragments
    (function() {
      var target = "Landing-page/landing.html" + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>

  <style>
    :root {
      --bg-dark: #0B0F19;
      --text-muted: #9CA3AF;
      --accent-cyan: #06B6D4;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-muted);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .redirect-card {
      max-width: 420px;
      padding: 2.25rem 2rem;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #1F2937;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .brand-title {
      color: #F9FAFB;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }
    .brand-title span {
      color: var(--accent-cyan);
    }
    p {
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      background-color: var(--accent-cyan);
      color: #000;
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }
    a.btn:hover {
      background-color: #0891B2;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <h1 class="brand-title">Vor<span>koo</span></h1>
    <p>Opening Vorkoo Landing Page...</p>
    <a href="Landing-page/landing.html" class="btn">Continue to Vorkoo &rarr;</a>
  </div>
</body>
</html>
